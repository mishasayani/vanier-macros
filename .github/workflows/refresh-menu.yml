name: Refresh Vanier menu

on:
  schedule:
    - cron: "17 11 * * *"   # every day around 4 am in Vancouver
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Build menu.json (3 days back, 2 weeks ahead)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_menu.py "$(TZ=America/Vancouver date -d '-3 days' +%F)" 17 --estimate
      - name: Commit if the menu changed
        run: |
          git config user.name "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json scripts/estimates.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Vanier menu $(TZ=America/Vancouver date +%F)"
          git push
