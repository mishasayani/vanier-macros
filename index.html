<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanier Macros</title>
<meta name="theme-color" content="#0f5b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; progress bars head each day, food as cards, tabs pinned to the bottom edge. */
:root {
  --paper: #f6f6f2;
  --card: #ffffff;
  --ink: #15171a;
  --muted: #646a70;
  --line: #e2e3de;
  --track: #ebece7;
  --accent: #0f5b4a;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --cal: #0f5b4a;
  --protein: #d23c3c;
  --carbs: #c98606;
  --fat: #7650cf;
  --over: #b4441c;
  --scrim: rgba(15, 17, 20, .42);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1113; --card: #191c1f; --ink: #eceee9; --muted: #9ba1a7; --line: #2a2e32; --track: #262a2e;
    --accent: #4cc29a; --accent-ink: #0b1f18; --accent-soft: #17342b;
    --cal: #4cc29a; --protein: #ff6b6b; --carbs: #f0b94a; --fat: #a98bff; --over: #ff8a5c; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1113; --card: #191c1f; --ink: #eceee9; --muted: #9ba1a7; --line: #2a2e32; --track: #262a2e;
  --accent: #4cc29a; --accent-ink: #0b1f18; --accent-soft: #17342b;
  --cal: #4cc29a; --protein: #ff6b6b; --carbs: #f0b94a; --fat: #a98bff; --over: #ff8a5c; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); margin: 0; }
[hidden] { display: none !important; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 112px;
  display: flex; flex-direction: column; gap: 16px;
}
#view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 850; font-stretch: 75%; font-size: 22px; letter-spacing: .01em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: .02em; color: var(--muted); text-transform: none; margin-top: 3px; }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; line-height: 1; flex: none; }
.datelabel { min-width: 92px; text-align: center; }
.datelabel button { background: none; border: 0; padding: 4px 6px; font-weight: 700; font-size: 14px; }

/* Progress */
.progress { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.prow .lbl { font-weight: 700; font-size: 14px; }
.prow .amt { font-weight: 700; text-align: right; font-size: 14px; }
.prow .amt span { color: var(--muted); font-weight: 500; }
.prow.cal .lbl { font-family: var(--display); font-weight: 850; font-stretch: 80%; font-size: 20px; }
.prow.cal .amt { font-family: var(--display); font-weight: 850; font-size: 26px; line-height: 1; }
.prow.cal .amt span { font-size: 15px; font-weight: 600; }
.bar { grid-column: 1 / -1; height: 10px; background: var(--track); border-radius: 999px; position: relative; overflow: hidden; }
.prow.cal .bar { height: 14px; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.prow .left { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.prow .left .ok { color: var(--accent); font-weight: 700; }
.prow .left .bad { color: var(--over); font-weight: 700; }
.progress .foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--accent); color: var(--accent-ink); padding: 11px 14px; border-radius: var(--radius); font-weight: 600; font-size: 14px; }
.banner .big { font-family: var(--display); font-weight: 900; font-stretch: 75%; font-size: 20px; text-transform: uppercase; white-space: nowrap; }

/* Sections and cards */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sech { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 80%; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sech span { font-family: var(--body); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 13px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.card .name { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; min-width: 0; }
.card .serv { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.card .add { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 24px; line-height: 1; display: grid; place-items: center; align-self: start; }
.card .qty { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; align-self: start; padding-top: 2px; }
.macros { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); padding-top: 9px; }
.macros div { display: flex; flex-direction: column; gap: 1px; padding-left: 10px; border-left: 1px solid var(--line); }
.macros div:first-child { padding-left: 0; border-left: 0; }
.macros b { font-weight: 800; font-size: 15px; line-height: 1.2; }
.macros span { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.macros.none { font-size: 13px; color: var(--muted); display: block; }

.fold { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.fold > button { width: 100%; background: none; border: 0; display: flex; align-items: center; gap: 12px; padding: 13px 14px; text-align: left; }
.fold > button .t { font-weight: 700; font-size: 15.5px; }
.fold > button .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold > button .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fold > button .chev { color: var(--muted); font-size: 18px; transition: transform .15s; flex: none; }
.fold[data-open="true"] > button .chev { transform: rotate(90deg); }
.fold .cards { padding: 0 10px 10px; }
.fold .card { border-color: var(--line); background: var(--paper); }

.empty { background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); padding: 20px 16px; color: var(--muted); font-size: 14px; text-align: center; }
.empty b { color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--track); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.hint { font-size: 12.5px; color: var(--muted); }

/* Forms */
.form { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.formh { margin: 0; font-family: var(--display); font-stretch: 80%; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 15px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); min-width: 0; }
label.f input, label.f select { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 9px 10px; font-size: 16px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); width: 100%; min-width: 0; }
.goalrow { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.goalrow:first-of-type { border-top: 0; }
.goalrow .gl { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.goalrow .gl small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.goalrow .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.goalrow .gi { display: flex; align-items: center; gap: 6px; }
.goalrow input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 9px 10px; font-size: 17px; font-weight: 700; text-align: right; }
.goalrow .u { color: var(--muted); font-size: 13px; font-weight: 600; width: 26px; }
.btn { border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--over); border: 1px solid var(--over); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }

/* Trends */
.hlist { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.hrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.hrow:first-child { border-top: 0; }
.hrow .d { font-size: 13px; font-weight: 600; }
.hrow .d small { display: block; color: var(--muted); font-weight: 500; }
.hbar { height: 10px; background: var(--track); border-radius: 5px; position: relative; overflow: hidden; }
.hbar i { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 5px; }
.hbar i.met { background: var(--accent); }
.hbar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .5; }
.hrow .v { font-size: 12.5px; text-align: right; color: var(--muted); white-space: nowrap; }
.hrow .v b { color: var(--ink); }
.chip { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.05; }
.stat span { font-size: 12px; color: var(--muted); }

/* Tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 2px 10px; font-weight: 700; font-size: 11px; letter-spacing: .03em; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav.tabs button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet h4 { margin: 0; font-family: var(--display); font-weight: 850; font-stretch: 80%; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.sheet .unit { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper .q { font-family: var(--display); font-weight: 900; font-size: 30px; min-width: 64px; text-align: center; }
.pills { display: flex; gap: 6px; margin-left: auto; }
.pills button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13.5px; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mac4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mac4 div { padding: 9px 6px 8px; text-align: center; background: var(--paper); border-radius: 10px; border-top: 3px solid var(--line); }
.mac4 b { display: block; font-family: var(--display); font-weight: 900; font-size: 21px; line-height: 1.1; }
.mac4 span { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.ing { font-size: 12px; color: var(--muted); max-height: 4.2em; overflow: hidden; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); } to { transform: none; } }
  .bar i, .hbar i { transition: width .35s ease; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">Vanier Macros<small>Gather · Place Vanier</small></div>
    <div class="datenav">
      <button class="iconbtn" id="prev" aria-label="Previous day">‹</button>
      <div class="datelabel"><button id="datebtn" aria-label="Jump to today"></button></div>
      <button class="iconbtn" id="next" aria-label="Next day">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15V9M12 15V5M18 15v-3"/></svg>Today</button>
    <button role="tab" data-tab="menu" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v6M5 3v6M17 21V3c-2 1-3 4-3 8h3"/></svg>Menu</button>
    <button role="tab" data-tab="custom" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
    <button role="tab" data-tab="history" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"/></svg>Trends</button>
    <button role="tab" data-tab="goals" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Goals</button>
  </div>
</nav>

<div id="sheetHost"></div>

<script>
(() => {
  // ---------- helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const r0 = n => Math.round(n || 0);
  const r1 = n => Math.round((n || 0) * 10) / 10;
  const fmt = n => r0(n).toLocaleString("en-CA");
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const shift = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const todayISO = () => iso(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const MEALS = ["Breakfast", "Lunch", "Dinner", "Snack", "Drinks"];
  const DRINK_WORDS = /\b(milk|chocolate milk|latte|coffee|americano|cappuccino|espresso|tea|chai|matcha|juice|smoothie|shake|soda|pop|coke|pepsi|sprite|lemonade|kombucha|water|boba|bubble tea|hot chocolate|gatorade|powerade|energy drink|red bull|monster)\b/i;
  const mealFor = name => DRINK_WORDS.test(name || "") ? "Drinks" : guessMeal();
  const MENU_MEALS = [["Breakfast", "Breakfast"], ["Lunch & Dinner", "Lunch & Dinner"], ["Baked Goods & Desserts", "Bakery"]];
  const DEFAULT_GOALS = { k: 2400, p: 150, c: 270, f: 80 };
  const MACROS = [
    { key: "k", name: "Calories", unit: "kcal", color: "--cal" },
    { key: "p", name: "Protein", unit: "g", color: "--protein" },
    { key: "c", name: "Carbs", unit: "g", color: "--carbs" },
    { key: "f", name: "Fat", unit: "g", color: "--fat" },
  ];
  const guessMeal = () => { const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 16 ? "Lunch" : h < 21 ? "Dinner" : "Snack"; };
  const guessMenuMeal = () => new Date().getHours() < 11 ? "Breakfast" : "Lunch & Dinner";

  // ---------- state ----------
  const st = {
    tab: "today", date: todayISO(), menuMeal: guessMenuMeal(), query: "",
    menu: null, menuError: false, staples: {}, open: {},
    days: {}, goals: null, myfoods: [], overrides: {},
  };

  // ---------- storage: everything lives in this phone's browser ----------
  const KEYS = { days: "vm.days", goals: "vm.goals", myfoods: "vm.myfoods", overrides: "vm.overrides" };
  const load = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
  const save = (k, v) => {
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch { toast("Couldn't save. Your phone may be out of storage."); }
  };
  try { const t = localStorage.getItem("vm.tab"); if (t) st.tab = t; } catch {}
  st.days = load(KEYS.days) || {};
  st.goals = load(KEYS.goals);
  st.myfoods = load(KEYS.myfoods) || [];
  st.overrides = load(KEYS.overrides) || {};
  // One-time move: chocolate milk logged under Snack goes to the new Drinks category.
  try {
    if (!localStorage.getItem("vm.moved.drinks")) {
      let moved = 0;
      for (const d of Object.keys(st.days)) {
        st.days[d] = st.days[d].map(e => (e.meal === "Snack" && /chocolate milk/i.test(e.name)) ? (moved++, { ...e, meal: "Drinks" }) : e);
      }
      if (moved) save(KEYS.days, st.days);
      localStorage.setItem("vm.moved.drinks", "1");
    }
  } catch {}
  const store = {
    saveDay() { save(KEYS.days, st.days); },
    saveGoals() { save(KEYS.goals, st.goals); },
    saveMyFoods() { save(KEYS.myfoods, st.myfoods); },
    saveOverrides() { save(KEYS.overrides, st.overrides); },
  };

  try { localStorage.removeItem("vm.apikey"); } catch {}

  // ---------- derived ----------
  const goals = () => st.goals || DEFAULT_GOALS;
  const entriesFor = d => st.days[d] || [];
  const totals = list => list.reduce((a, e) => {
    const q = e.qty || 1; a.k += e.k * q; a.p += e.p * q; a.c += e.c * q; a.f += e.f * q; return a;
  }, { k: 0, p: 0, c: 0, f: 0 });
  // Goal rules: protein is met at or above target; calories, carbs and fat within 10% of target.
  const status = (key, val, goal) => {
    if (!goal) return "none";
    if (key === "p") return val >= goal ? "met" : "under";
    if (val > goal * 1.1) return "over";
    return val >= goal * 0.9 ? "met" : "under";
  };
  const dayMet = t => { const g = goals(); return status("k", t.k, g.k) === "met" && status("p", t.p, g.p) === "met"; };
  const foodMacros = (fid, f) => st.overrides[fid] || (f && f.k != null ? { k: f.k, p: f.p, c: f.c, f: f.f } : null);

  // Foods served on most days of a meal are "every day" staples, not that day's mains.
  function computeStaples(menu) {
    const out = {};
    for (const [meal] of MENU_MEALS) {
      const count = {}; let days = 0;
      for (const day of Object.values(menu.menus)) {
        if (!day[meal]) continue;
        days++;
        new Set(day[meal].filter(([s]) => s === "").flatMap(([, ids]) => ids)).forEach(id => { count[id] = (count[id] || 0) + 1; });
      }
      out[meal] = new Set(days >= 4 ? Object.keys(count).filter(id => count[id] >= days * 0.75) : []);
    }
    return out;
  }

  // Turn Nutrislice's station list into: mains first, then folded sections.
  const SECTION_INFO = {
    mains: { title: "Today's mains", open: true },
    staples: { title: "Every day", sub: "Always out at this meal" },
    sides: { title: "Sides" },
    pasta: { title: "Pasta bar", sub: "Pasta, sauces and add-ins" },
    sandwich: { title: "Sandwich bar", sub: "Breads, deli meats, cheese, toppings" },
    cereal: { title: "Cereal & oatmeal" },
    dimsum: { title: "Dim sum" },
    icecream: { title: "Ice cream" },
  };
  function sectionsFor(meal, groups) {
    const map = new Map(), seen = new Set();
    const put = (key, title, id) => {
      if (seen.has(id)) return;
      const f = st.menu.foods[id];
      if (!f || f.n === "Special Feature") return;
      seen.add(id);
      if (!map.has(key)) map.set(key, { key, ids: [], ...(SECTION_INFO[key] || { title }) });
      map.get(key).ids.push(id);
    };
    if (meal === "Baked Goods & Desserts") {
      for (const [s, ids] of groups) {
        const key = /^check dining/i.test(s) ? "icecream" : "bake:" + (s || "Other");
        ids.forEach(id => put(key, s || "Other", id));
      }
      return [...map.values()];
    }
    const staples = st.staples[meal] || new Set();
    let bar = null;
    for (const [s, ids] of groups) {
      const n = s.toLowerCase();
      let key;
      if (n === "") { bar = null; }
      else if (n === "not available") continue;
      else if (n === "sides" || n === "add ons") { bar = null; key = "sides"; }
      else if (n === "pasta bar") { bar = "pasta"; key = "pasta"; }
      else if (n.startsWith("build your own")) { bar = "sandwich"; key = "sandwich"; }
      else if (["breads", "cheese", "vegetables"].includes(n)) { bar = "sandwich"; key = "sandwich"; }
      else if (n === "sauces" || n === "proteins") key = bar || "sandwich";
      else if (n.includes("cereal")) key = "cereal";
      else if (n.startsWith("check dining")) key = meal === "Breakfast" ? "dimsum" : "other:" + s;
      else key = "other:" + s;
      ids.forEach(id => put(n === "" ? (staples.has(id) ? "staples" : "mains") : key, s, id));
    }
    const order = ["mains", "staples", "sides", "pasta", "sandwich", "cereal", "dimsum"];
    return [...map.values()].sort((a, b) => {
      const ia = order.indexOf(a.key), ib = order.indexOf(b.key);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  }

  // ---------- rendering ----------
  function render() {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === st.tab)));
    const t = todayISO();
    const d = parse(st.date);
    const label = st.date === t ? "Today" : st.date === shift(t, -1) ? "Yesterday" : st.date === shift(t, 1) ? "Tomorrow"
      : d.toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" });
    $("#datebtn").textContent = label;
    $(".datenav").hidden = st.tab === "goals" || st.tab === "history";
    const v = $("#view");
    if (st.tab === "today") v.innerHTML = viewToday();
    else if (st.tab === "menu") v.innerHTML = viewMenu();
    else if (st.tab === "custom") v.innerHTML = viewCustom();
    else if (st.tab === "history") v.innerHTML = viewHistory();
    else v.innerHTML = viewGoals();
    bindView();
  }

  const macroCells = m => m
    ? `<div class="macros num"><div><b>${fmt(m.k)}</b><span>cal</span></div><div><b>${r0(m.p)}g</b><span>protein</span></div><div><b>${r0(m.c)}g</b><span>carbs</span></div><div><b>${r0(m.f)}g</b><span>fat</span></div></div>`
    : `<div class="macros none">No estimate yet. Tap to add the numbers.</div>`;

  function progressPanel(date) {
    const g = goals(), tt = totals(entriesFor(date));
    const rows = MACROS.map(({ key, name, unit, color }) => {
      const val = tt[key], goal = g[key] || 0;
      const s = status(key, val, goal);
      const pct = goal ? Math.min(100, val / goal * 100) : 0;
      const u = unit === "g" ? "g" : "";
      const right = s === "met" ? `<span class="ok">Goal hit</span>`
        : s === "over" ? `<span class="bad">${fmt(val - goal)}${u} over</span>`
        : `<span>${fmt(Math.max(0, goal - val))}${u} left</span>`;
      return `<div class="prow num ${key === "k" ? "cal" : ""}">
        <div class="lbl">${name}</div><div class="amt">${fmt(val)}${u}<span> / ${fmt(goal)}${unit === "g" ? "g" : " kcal"}</span></div>
        <div class="bar"><i style="width:${pct}%;background:var(${s === "over" ? "--over" : color})"></i></div>
        <div class="left"><span>${goal ? Math.round(val / goal * 100) : 0}%</span>${right}</div></div>`;
    }).join("");
    return `<section class="progress" aria-label="Daily progress">${rows}
      <div class="foot"><span>${st.goals ? "Your daily goals" : "Using starter goals"}</span><button class="linkbtn" data-go="goals">${st.goals ? "Change goals" : "Set your goals"}</button></div></section>`;
  }

  function entryCard(e) {
    const q = e.qty || 1;
    return `<button class="card" data-entry="${esc(e.id)}">
      <div style="min-width:0"><div class="name">${esc(e.name)}</div>${q !== 1 ? `<div class="serv">${r1(q)} servings</div>` : ""}</div>
      <span class="qty">Edit</span>
      ${macroCells({ k: e.k * q, p: e.p * q, c: e.c * q, f: e.f * q })}</button>`;
  }

  function viewToday() {
    const list = entriesFor(st.date);
    const tt = totals(list);
    let html = "";
    if (list.length && dayMet(tt)) html += `<div class="banner"><span class="big">Goal met</span><span>Calories and protein are on target.</span></div>`;
    html += progressPanel(st.date);
    if (!list.length) {
      html += `<div class="empty"><b>Nothing logged ${st.date === todayISO() ? "today" : "for this day"} yet.</b><br>Open the menu to add what you ate at Gather.</div>
        <button class="btn" data-go="menu">Open today's menu</button>`;
      return html;
    }
    for (const m of MEALS) {
      const es = list.filter(e => (e.meal || "Snack") === m);
      if (!es.length) continue;
      const t = totals(es);
      html += `<section class="sec"><h3 class="sech">${m}<span class="num">${fmt(t.k)} cal · ${r0(t.p)}g protein</span></h3><div class="cards">${es.map(entryCard).join("")}</div></section>`;
    }
    html += `<button class="btn ghost" data-go="menu">Add more food</button>`;
    return html;
  }

  function foodCard(fid, f) {
    const m = foodMacros(fid, f);
    return `<button class="card" data-food="${esc(fid)}">
      <div style="min-width:0"><div class="name">${esc(f.n)}</div>${f.u ? `<div class="serv">${esc(f.u)}</div>` : ""}</div>
      <span class="add" aria-hidden="true">+</span>
      ${macroCells(m)}</button>`;
  }
  function myFoodCard(f) {
    return `<button class="card" data-myfood="${esc(f.id)}">
      <div style="min-width:0"><div class="name">${esc(f.name)}</div><div class="serv">${esc(f.meal || "Saved food")} · tap to add or edit</div></div>
      <span class="add" aria-hidden="true">+</span>${macroCells(f)}</button>`;
  }

  function viewMenu() {
    let html = `<div class="seg" role="group" aria-label="Meal">${MENU_MEALS.map(([m, label]) => `<button data-menumeal="${esc(m)}" aria-pressed="${m === st.menuMeal}">${label}</button>`).join("")}</div>
      <input class="search" id="q" type="search" placeholder="Search all Vanier food and saved foods" value="${esc(st.query)}" autocomplete="off">
      <div id="menubody">${menuBody()}</div>`;
    return html;
  }

  function menuBody() {
    if (!st.menu) return `<div class="empty">${st.menuError ? "The menu didn't load. Check your connection and reopen the app." : "Loading the Vanier menu…"}</div>`;
    const q = st.query.trim().toLowerCase();
    if (q) {
      const hits = Object.entries(st.menu.foods).filter(([, f]) => f.n.toLowerCase().includes(q) && f.n !== "Special Feature").slice(0, 60);
      const mine = st.myfoods.filter(f => f.name.toLowerCase().includes(q));
      if (!hits.length && !mine.length) return `<div class="empty">No match for "${esc(st.query)}". Use the <b>Add</b> tab to enter it yourself.</div>`;
      return `<section class="sec"><h3 class="sech">Results<span>${hits.length + mine.length} found</span></h3><div class="cards">${mine.map(myFoodCard).join("")}${hits.map(([id, f]) => foodCard(id, f)).join("")}</div></section>`;
    }
    const day = st.menu.menus[st.date];
    const groups = day && day[st.menuMeal];
    if (!groups) {
      const outside = st.date < st.menu.from || st.date > st.menu.to;
      return `<div class="empty">${outside
        ? `<b>This day's menu isn't posted yet.</b><br>It updates every morning, usually two weeks ahead. Search above for foods that repeat.`
        : `<b>Gather has nothing listed here for this day.</b>`}</div>`;
    }
    const secs = sectionsFor(st.menuMeal, groups);
    let html = "";
    for (const s of secs) {
      const key = st.menuMeal + "|" + s.key;
      if (s.open) {
        html += `<section class="sec"><h3 class="sech">${esc(s.title)}<span>${s.ids.length} dishes</span></h3><div class="cards">${s.ids.map(id => foodCard(id, st.menu.foods[id])).join("")}</div></section>`;
        continue;
      }
      const open = !!st.open[key];
      const preview = s.sub || s.ids.slice(0, 4).map(id => st.menu.foods[id].n).join(", ");
      html += `<div class="fold" data-open="${open}"><button data-fold="${esc(key)}" aria-expanded="${open}">
        <span class="txt"><span class="t">${esc(s.title)} <span class="hint">· ${s.ids.length}</span></span><span class="s">${esc(preview)}</span></span><span class="chev" aria-hidden="true">›</span></button>
        ${open ? `<div class="cards">${s.ids.map(id => foodCard(id, st.menu.foods[id])).join("")}</div>` : ""}</div>`;
    }
    html += `<p class="hint">From UBC Nutrislice${st.menu.built ? `, updated ${esc(st.menu.built.slice(0, 10))}` : ""}. Macros are estimates per dining-hall serving; tap a dish to correct them.</p>`;
    return html;
  }

  function viewCustom() {
    const mine = st.myfoods.length ? `<section class="sec"><h3 class="sech">Saved foods<span>${st.myfoods.length}</span></h3><div class="cards">${st.myfoods.map(myFoodCard).join("")}</div></section>` : "";
    return `<form class="form" id="manual" novalidate>
        <label class="f" for="mname">Food<input id="mname" required placeholder="Protein bar, latte, snack…" autocomplete="off"></label>
        <div class="grid4">
          <label class="f" for="mk">Cal<input id="mk" type="number" inputmode="decimal" min="0" placeholder="0"></label>
          <label class="f" for="mp">Protein<input id="mp" type="number" inputmode="decimal" min="0" placeholder="g"></label>
          <label class="f" for="mc">Carbs<input id="mc" type="number" inputmode="decimal" min="0" placeholder="g"></label>
          <label class="f" for="mf">Fat<input id="mf" type="number" inputmode="decimal" min="0" placeholder="g"></label>
        </div>
        <div class="grid2">
          <label class="f" for="mmeal">Meal<select id="mmeal">${MEALS.map(m => `<option ${m === guessMeal() ? "selected" : ""}>${m}</option>`).join("")}</select></label>
          <label class="f" for="mqty">Servings<input id="mqty" type="number" inputmode="decimal" min="0.25" step="0.25" value="1"></label>
        </div>
        <div class="hint" id="mcalc"></div>
        <label class="check"><input type="checkbox" id="msave"> Save to my foods for next time</label>
        <button class="btn" type="submit">Add to ${st.date === todayISO() ? "today" : "this day"}</button>
      </form>
      ${mine}`;
  }

  function viewHistory() {
    const g = goals();
    const t = todayISO();
    const days = [];
    for (let i = 0; i < 14; i++) days.push(shift(t, -i));
    const logged = days.filter(d => entriesFor(d).length);
    const met = logged.filter(d => dayMet(totals(entriesFor(d))));
    let streak = 0;
    for (let i = entriesFor(t).length && dayMet(totals(entriesFor(t))) ? 0 : 1; i < 400; i++) {
      const d = shift(t, -i);
      if (entriesFor(d).length && dayMet(totals(entriesFor(d)))) streak++; else break;
    }
    const avg = k => logged.length ? logged.reduce((a, d) => a + totals(entriesFor(d))[k], 0) / logged.length : 0;
    const maxK = Math.max(g.k * 1.25, ...days.map(d => totals(entriesFor(d)).k));
    const rows = days.map(d => {
      const tt = totals(entriesFor(d));
      const has = entriesFor(d).length > 0;
      const ok = has && dayMet(tt);
      const dd = parse(d);
      return `<button class="hrow" data-day="${d}"><div class="d">${dd.toLocaleDateString("en-CA", { weekday: "short" })}<small>${dd.toLocaleDateString("en-CA", { month: "short", day: "numeric" })}</small></div>
        <div class="hbar"><i class="${ok ? "met" : ""}" style="width:${has ? Math.min(100, tt.k / maxK * 100) : 0}%"></i><u style="left:${g.k / maxK * 100}%"></u></div>
        <div class="v num">${has ? `<b>${fmt(tt.k)}</b> · ${r0(tt.p)}g P${ok ? ' <span class="chip">Met</span>' : ""}` : "—"}</div></button>`;
    }).join("");
    return `<div class="stats num">
        <div class="stat"><b>${streak}</b><span>day streak on target</span></div>
        <div class="stat"><b>${met.length}/${logged.length || 0}</b><span>logged days met goal</span></div>
        <div class="stat"><b>${fmt(avg("k"))}</b><span>avg cal · ${r0(avg("p"))}g protein</span></div>
      </div>
      <section class="sec"><h3 class="sech">Last 14 days<span>line marks your calorie goal</span></h3><div class="hlist">${rows}</div></section>`;
  }

  function viewGoals() {
    const g = goals();
    const rows = MACROS.map(({ key, name, unit, color }) => `<div class="goalrow">
        <div class="gl"><span class="sw" style="background:var(${color})"></span><div>${name}<small>${key === "p" ? "Hit it by reaching it" : "Hit it within 10%"}</small></div></div>
        <div class="gi"><input id="g${key}" type="number" inputmode="numeric" min="0" value="${g[key]}" aria-label="${name} goal"><span class="u">${unit === "g" ? "g" : "cal"}</span></div></div>`).join("");
    return `<form class="form" id="goalform" novalidate>
        <h3 class="formh">Daily goals</h3>
        <div>${rows}</div>
        <div class="hint num" id="gcalc"></div>
        <button class="btn" type="submit">Save goals</button>
        <div class="note">A day counts as "Goal met" when protein reaches its goal and calories land within 10% of theirs.</div>
      </form>
      <section class="form">
        <h3 class="formh">Backup</h3>
        <div class="hint">Your log lives only on this phone. Save a backup now and then, especially before clearing Safari data or switching phones.</div>
        <div class="row"><button class="btn grow" type="button" id="export">Save backup file</button>
        <label class="btn ghost grow" for="importfile" style="text-align:center;cursor:pointer">Restore backup<input id="importfile" type="file" accept="application/json,.json" hidden></label></div>
      </section>`;
  }

  // ---------- events ----------
  function bindView() {
    const v = $("#view");
    v.onclick = e => {
      const t = e.target.closest("button");
      if (!t || !v.contains(t)) return;
      if (t.dataset.go) setTab(t.dataset.go);
      else if (t.dataset.entry) openEntry(t.dataset.entry);
      else if (t.dataset.food) openFood(t.dataset.food);
      else if (t.dataset.myfood) openMyFood(t.dataset.myfood);
      else if (t.dataset.menumeal) { st.menuMeal = t.dataset.menumeal; render(); }
      else if (t.dataset.day) { st.date = t.dataset.day; setTab("today"); }
      else if (t.dataset.fold) { st.open[t.dataset.fold] = !st.open[t.dataset.fold]; $("#menubody").innerHTML = menuBody(); }
    };
    const q = $("#q");
    if (q) q.oninput = () => { st.query = q.value; $("#menubody").innerHTML = menuBody(); };
    const mf = $("#manual");
    if (mf) {
      const calc = () => {
        const p = +$("#mp").value || 0, c = +$("#mc").value || 0, f = +$("#mf").value || 0;
        $("#mcalc").textContent = (p || c || f) ? `Macros add up to about ${fmt(p * 4 + c * 4 + f * 9)} cal.` : "";
      };
      let mealTouched = false;
      $("#mmeal").onchange = () => { mealTouched = true; };
      mf.oninput = e => {
        calc();
        if (e && e.target && e.target.id === "mname" && !mealTouched) $("#mmeal").value = mealFor($("#mname").value);
      };
      calc();
      mf.onsubmit = e => {
        e.preventDefault();
        const name = $("#mname").value.trim();
        if (!name) { $("#mname").focus(); toast("Give the food a name."); return; }
        const p = +$("#mp").value || 0, c = +$("#mc").value || 0, f = +$("#mf").value || 0;
        let k = +$("#mk").value || 0;
        if (!k && (p || c || f)) k = p * 4 + c * 4 + f * 9;
        const qty = +$("#mqty").value || 1;
        const meal = $("#mmeal").value;
        if ($("#msave").checked) { st.myfoods = [{ id: uid(), name, k, p, c, f, meal }, ...st.myfoods.filter(x => x.name !== name)]; store.saveMyFoods(); }
        addEntry({ name, k, p, c, f, qty, meal, src: "custom" });
      };
    }
    const gf = $("#goalform");
    if (gf) {
      const calc = () => { const p = +$("#gp").value || 0, c = +$("#gc").value || 0, f = +$("#gf").value || 0; $("#gcalc").textContent = `Your protein, carb and fat goals add up to ${fmt(p * 4 + c * 4 + f * 9)} cal.`; };
      gf.oninput = calc; calc();
      gf.onsubmit = e => {
        e.preventDefault();
        st.goals = { k: +$("#gk").value || 0, p: +$("#gp").value || 0, c: +$("#gc").value || 0, f: +$("#gf").value || 0 };
        store.saveGoals(); toast("Goals saved"); render();
      };
    }
    const ex = $("#export");
    if (ex) ex.onclick = () => {
      const blob = new Blob([JSON.stringify({ app: "vanier-macros", version: 1, saved: new Date().toISOString(),
        days: st.days, goals: st.goals, myfoods: st.myfoods, overrides: st.overrides }, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `vanier-macros-backup-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    const im = $("#importfile");
    if (im) im.onchange = async () => {
      const file = im.files && im.files[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (data.app !== "vanier-macros" || typeof data.days !== "object") throw 0;
        st.days = data.days || {}; st.goals = data.goals || null; st.myfoods = data.myfoods || []; st.overrides = data.overrides || {};
        store.saveDay(); store.saveGoals(); store.saveMyFoods(); store.saveOverrides();
        toast(`Restored ${Object.keys(st.days).length} days`); render();
      } catch { toast("That file isn't a Vanier Macros backup."); }
    };
  }

  function addEntry(e) {
    const entry = { id: uid(), t: Date.now(), ...e };
    st.days = { ...st.days, [st.date]: [...entriesFor(st.date), entry] };
    store.saveDay();
    closeSheet();
    toast(`Added to ${e.meal}`);
    render();
  }

  // ---------- sheets ----------
  function closeSheet() { $("#sheetHost").innerHTML = ""; }
  function sheet(html, bind) {
    $("#sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    $("#scrim").onclick = e => { if (e.target.id === "scrim") closeSheet(); };
    bind($("#sheetHost .sheet"));
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // One sheet for adding a menu food, a saved food, or editing a logged entry.
  function portionSheet({ title, unit, base, ing, qty = 1, meal = guessMeal(), onSave, onDelete, saveLabel, rememberable, editName, extra }) {
    let q = qty, m = { ...base };
    const has = base && base.k != null;
    sheet(`
      ${editName ? `<label class="f" for="sname">Name<input id="sname" value="${esc(title)}" autocomplete="off"></label>` : `<div><h4>${esc(title)}</h4><div class="unit">${unit ? "1 serving = " + esc(unit) : ""}</div></div>`}
      <div class="mac4 num" id="mac"></div>
      <div class="stepper"><button class="iconbtn" id="minus" aria-label="Less">−</button><div class="q num" id="qv"></div><button class="iconbtn" id="plus" aria-label="More">+</button>
        <div class="pills">${[0.5, 1, 1.5, 2].map(x => `<button data-q="${x}">${x}</button>`).join("")}</div></div>
      <label class="f" for="smeal">Meal<select id="smeal">${MEALS.map(x => `<option ${x === meal ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      <details ${has ? "" : "open"} id="edit"><summary class="hint" style="cursor:pointer">${has ? "Numbers look off? Edit per serving" : "Enter numbers per serving"}</summary>
        <div class="grid4" style="margin-top:10px">
          <label class="f" for="ek">Cal<input id="ek" type="number" inputmode="decimal" value="${has ? r0(m.k) : ""}"></label>
          <label class="f" for="ep">Protein<input id="ep" type="number" inputmode="decimal" value="${has ? r1(m.p) : ""}"></label>
          <label class="f" for="ec">Carbs<input id="ec" type="number" inputmode="decimal" value="${has ? r1(m.c) : ""}"></label>
          <label class="f" for="ef">Fat<input id="ef" type="number" inputmode="decimal" value="${has ? r1(m.f) : ""}"></label>
        </div>
        ${rememberable ? `<label class="check" style="margin-top:10px"><input type="checkbox" id="remember" checked> Use these numbers whenever this dish is served</label>` : ""}
      </details>
      ${ing ? `<div class="ing">${esc(ing)}</div>` : ""}
      <div class="row"><button class="btn grow" id="save">${saveLabel}</button>${extra ? `<button class="btn ghost" id="extra">${esc(extra.label)}</button>` : ""}${onDelete ? `<button class="btn danger" id="del">Remove</button>` : ""}<button class="btn ghost" id="cancel">Cancel</button></div>
    `, el => {
      const readEdit = () => ({ k: +$("#ek", el).value || 0, p: +$("#ep", el).value || 0, c: +$("#ec", el).value || 0, f: +$("#ef", el).value || 0 });
      const paint = () => {
        $("#qv", el).textContent = r1(q) + "×";
        $("#mac", el).innerHTML = MACROS.map(({ key, color }, i) =>
          `<div style="border-top-color:var(${color})"><b>${i ? r0(m[key] * q) + "g" : fmt(m.k * q || 0)}</b><span>${["cal", "protein", "carbs", "fat"][i]}</span></div>`).join("");
        el.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.q === q)));
      };
      if (!has) m = { k: 0, p: 0, c: 0, f: 0 };
      $("#minus", el).onclick = () => { q = Math.max(0.25, q - 0.5); paint(); };
      $("#plus", el).onclick = () => { q = q + 0.5; paint(); };
      el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { q = +b.dataset.q; paint(); });
      $("#edit", el).oninput = e => { if (e.target.id !== "remember") { m = readEdit(); paint(); } };
      $("#cancel", el).onclick = closeSheet;
      if (onDelete) $("#del", el).onclick = onDelete;
      if (extra) $("#extra", el).onclick = extra.onClick;
      $("#save", el).onclick = () => {
        const edited = $("#edit", el).open ? readEdit() : m;
        const remember = $("#remember", el);
        const nameEl = $("#sname", el);
        const name = nameEl ? nameEl.value.trim() : title;
        if (!name) { nameEl.focus(); toast("Give the food a name."); return; }
        onSave({ macros: edited, qty: q, meal: $("#smeal", el).value, remember: remember ? remember.checked : false, name });
      };
      paint();
    });
  }

  function openFood(fid) {
    const f = st.menu.foods[fid];
    if (!f) return;
    const base = foodMacros(fid, f);
    const now = guessMeal();
    portionSheet({
      title: f.n, unit: f.u, base, ing: f.ing, saveLabel: "Add", rememberable: true,
      meal: DRINK_WORDS.test(f.n) ? "Drinks" : st.menuMeal === "Breakfast" ? "Breakfast" : st.menuMeal === "Baked Goods & Desserts" ? (now === "Breakfast" ? "Breakfast" : "Snack") : (now === "Breakfast" ? "Lunch" : now),
      onSave: ({ macros, qty, meal, remember }) => {
        const changed = !base || ["k", "p", "c", "f"].some(k => Math.abs((base[k] || 0) - macros[k]) > 0.01);
        if (changed && remember) { st.overrides = { ...st.overrides, [fid]: macros }; store.saveOverrides(); }
        addEntry({ name: f.n, ...macros, qty, meal, src: "vanier", fid });
      },
    });
  }

  function openMyFood(id) {
    const f = st.myfoods.find(x => x.id === id);
    if (!f) return;
    portionSheet({
      title: f.name, base: f, saveLabel: "Add", meal: f.meal || mealFor(f.name),
      onSave: ({ macros, qty, meal }) => addEntry({ name: f.name, ...macros, qty, meal, src: "custom" }),
      extra: { label: "Edit food", onClick: () => editMyFood(id) },
    });
  }

  // Change a saved food's name, macros or category. Past log entries keep their own copy.
  function editMyFood(id) {
    const f = st.myfoods.find(x => x.id === id);
    if (!f) return;
    sheet(`
      <h4>Edit saved food</h4>
      <label class="f" for="xname">Name<input id="xname" value="${esc(f.name)}" autocomplete="off"></label>
      <div class="grid4">
        <label class="f" for="xk">Cal<input id="xk" type="number" inputmode="decimal" min="0" value="${r0(f.k)}"></label>
        <label class="f" for="xp">Protein<input id="xp" type="number" inputmode="decimal" min="0" value="${r1(f.p)}"></label>
        <label class="f" for="xc">Carbs<input id="xc" type="number" inputmode="decimal" min="0" value="${r1(f.c)}"></label>
        <label class="f" for="xf">Fat<input id="xf" type="number" inputmode="decimal" min="0" value="${r1(f.f)}"></label>
      </div>
      <label class="f" for="xmeal">Category<select id="xmeal">${MEALS.map(m => `<option ${m === (f.meal || mealFor(f.name)) ? "selected" : ""}>${m}</option>`).join("")}</select></label>
      <div class="hint">Numbers are for one serving. Changes apply the next time you add this food; anything already logged stays as it was.</div>
      <div class="row"><button class="btn grow" id="xsave">Save</button><button class="btn danger" id="xdel">Delete</button><button class="btn ghost" id="xcancel">Cancel</button></div>
    `, el => {
      $("#xcancel", el).onclick = closeSheet;
      $("#xdel", el).onclick = () => { st.myfoods = st.myfoods.filter(x => x.id !== id); store.saveMyFoods(); closeSheet(); toast("Deleted from saved foods"); render(); };
      $("#xsave", el).onclick = () => {
        const name = $("#xname", el).value.trim();
        if (!name) { $("#xname", el).focus(); toast("Give the food a name."); return; }
        const num = s => Math.max(0, +$(s, el).value || 0);
        const upd = { ...f, name, k: num("#xk"), p: num("#xp"), c: num("#xc"), f: num("#xf"), meal: $("#xmeal", el).value };
        st.myfoods = st.myfoods.map(x => x.id === id ? upd : x);
        store.saveMyFoods(); closeSheet(); toast("Saved food updated"); render();
      };
    });
  }

  function openEntry(id) {
    const e = entriesFor(st.date).find(x => x.id === id);
    if (!e) return;
    const f = e.fid && st.menu ? st.menu.foods[e.fid] : null;
    portionSheet({
      title: e.name, unit: f && f.u, base: e, qty: e.qty || 1, meal: e.meal, saveLabel: "Save changes", editName: e.src === "custom",
      onSave: ({ macros, qty, meal, name }) => {
        st.days = { ...st.days, [st.date]: entriesFor(st.date).map(x => x.id === id ? { ...x, ...macros, qty, meal, name } : x) };
        store.saveDay(); closeSheet(); toast("Updated"); render();
      },
      onDelete: () => {
        st.days = { ...st.days, [st.date]: entriesFor(st.date).filter(x => x.id !== id) };
        store.saveDay(); closeSheet(); toast("Removed"); render();
      },
    });
  }

  let toastTimer;
  function toast(msg) {
    let t = $("#toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
  }

  function setTab(t) { st.tab = t; try { localStorage.setItem("vm.tab", t); } catch {} closeSheet(); render(); window.scrollTo(0, 0); }
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("#prev").onclick = () => { st.date = shift(st.date, -1); render(); };
  $("#next").onclick = () => { st.date = shift(st.date, 1); render(); };
  $("#datebtn").onclick = () => { st.date = todayISO(); render(); };

  // ---------- boot ----------
  const setMenu = m => { st.menu = m; st.staples = computeStaples(m); render(); };
  render();
  fetch("menu.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(setMenu)
    .catch(() => { st.menuError = true; render(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // Pick up a new day's menu when the app comes back to the foreground.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    fetch("menu.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(m => { if (m) setMenu(m); }).catch(() => {});
  });
})();
</script>
</body>
</html>
